# Golden dataset — the "answer key" for retrieval evals.
#
# Each topic = a question a user might ask + papers a GOOD balanced reading list
# (12 papers) MUST contain.
#
#   kind: foundational  -> landmark work (tests the relevant / highly_cited buckets)
#   kind: recent        -> important newer work (tests the recent bucket)
#
# Papers are matched by DOI or normalized title. OpenAlex sometimes has several
# records of one paper (arXiv preprint + conference version) with different DOIs,
# so the title is a fallback match.
#
# Check every entry exists in OpenAlex (lookups are free) and write golden.lock.json:
#     python evals/verify_golden.py
#
# golden.lock.json = machine-generated, do not edit. It records what OpenAlex
# actually stores for each paper (ID, DOI, exact title) — often a DIFFERENT DOI
# than the arXiv one (e.g. the conference version). The eval matches on all of
# them, so a found paper is never wrongly counted as missed.
#
# ADD YOUR OWN: copy a topic block, keep must-haves few (2-3) and truly essential.

topics:
  # ---------------------------------------------------------------- AI / ML (fast)
  - id: rag
    field: AI
    question: retrieval-augmented generation for knowledge-intensive NLP tasks
    must_include:
      - title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
        year: 2020
        doi: 10.48550/arxiv.2005.11401
        kind: foundational
      - title: "Retrieval-Augmented Generation for Large Language Models: A Survey"
        year: 2023
        doi: 10.48550/arxiv.2312.10997
        kind: recent

  - id: llm-tool-use
    field: AI
    question: tool use in large language model agents
    must_include:
